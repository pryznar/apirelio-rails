name: Publish gem

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2
      - run: gem build apirelio-rails.gemspec
      - run: gem push apirelio-rails-*.gem
